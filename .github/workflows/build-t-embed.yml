name: Build Bruce for T-Embed CC1101

on:
  push:
    branches: [ "t-embed-custom-mod" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install PlatformIO
      run: |
        pip install platformio==6.1.13
        
    - name: Nuclear clean
      run: |
        rm -rf ~/.platformio
        rm -rf .pio
        sudo rm -rf /tmp/platformio*
        
    - name: Install ESP32 framework 2.0.14
      run: |
        wget -q https://github.com/espressif/arduino-esp32/releases/download/2.0.14/esp32-2.0.14.zip
        mkdir -p ~/.platformio/packages/framework-arduinoespressif32
        unzip -q esp32-2.0.14.zip -d ~/.platformio/packages/
        rm esp32-2.0.14.zip
        
    - name: Build T-Embed
      run: |
        pio run -e lilygo-t-embed-cc1101 || pio run -e lilygo-t-embed-cc1101 -v
        
    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: bruce-t-embed
        path: .pio/build/lilygo-t-embed-cc1101/*.bin
