name: Test Build

on:
  push:
    branches: [ fix-compilation-errors ]
  pull_request:
    branches: [ fix-compilation-errors ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup PlatformIO
      uses: platformio/setup-platformio@v2
      
    - name: Install ESP32 Platform
      run: |
        pio platform install "espressif32@6.5.0"
        pio platform list
      
    - name: Install ArduinoJson
      run: pio lib install "ArduinoJson@6.21.3"
      
    - name: Build LilyGO T-Embed
      run: pio run -e lilygo-t-embed-cc1101
      
    - name: Check build artifacts
      run: |
        echo "=== Собранные файлы ==="
        find .pio/build -name "*.bin" -o -name "*.elf" | xargs ls -la 2>/dev/null || echo "Файлы не найдены"
        
    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: test-firmware
        path: .pio/build/**/*
        retention-days: 3
