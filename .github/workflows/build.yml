name: Build T-Embed Firmware

on:
  push:
    branches: [t-embed-custom-mod]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install PlatformIO
      run: |
        pip install platformio
        
    - name: Build firmware
      run: |
        pio run -e lilygo-t-embed-cc1101
        
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: .pio/build/lilygo-t-embed-cc1101/firmware.bin
        retention-days: 7
