; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
platform = espressif32 @ ^6.7.0
lib_deps = 
    mquickjs
    bblanchon/ArduinoJson@^6.21.3

[env]
platform = espressif32 @ ^6.7.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
lib_deps = 
    ${platformio.lib_deps}
monitor_filters = direct

[env:lilygo-t-embed-cc1101]
board = lilygo-t-embed-cc1101
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DSS=-1
    -DCONFIG_LITTLEFS_FOR_IDF_3_2
    -DTFT_eSPI=1
    -DCONFIG_LITTLEFS_PAGE_SIZE=256
    -DCONFIG_LITTLEFS_BLOCK_SIZE=8192
    -DCONFIG_LITTLEFS_CACHE_SIZE=512
    -DHTTP_MAX_DATA_WAIT=5000
    -DCONFIG_MICRO_ROS_AGENT_IP=192.168.1.100
    -DBOARD_HAS_PSRAM
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DCONFIG_ARDUINO_EVENT_RUNNING_CORE=1
    -DCONFIG_ARDUINO_EVENT_TASK_STACK_SIZE=8192
    -DCONFIG_ARDUINO_EVENT_TASK_PRIORITY=2
    -DHTTP_MAX_DATA_WAIT=5000
    -DSD_MMC_1BIT_MODE
    -DSD_MMC_CLK_GPIO=36
    -DSD_MMC_CMD_GPIO=37
    -DSD_MMC_D0_GPIO=35
    -DSD_MMC_D1_GPIO=38
    -DSD_MMC_D2_GPIO=33
    -DSD_MMC_D3_GPIO=34
    -DUSE_SPI_SD
    -DSDSPI_CS_GPIO=5
    -DSDSPI_MOSI_GPIO=11
    -DSDSPI_MISO_GPIO=13
    -DSDSPI_SCK_GPIO=12
    -DLITTLEFS_MKFS_PATH=\"/littlefs\"
    -DLITTLEFS_MOUNT_PATH=\"/littlefs\"
    -DCONFIG_LITTLEFS_OBJ_NAME_LEN=64
    -DCONFIG_LITTLEFS_CACHE_SIZE=512
    -DCONFIG_LITTLEFS_BLOCK_SIZE=8192
    -DCONFIG_LITTLEFS_PAGE_SIZE=256
    -DCONFIG_LITTLEFS_LOOKAHEAD_SIZE=128
    -DCONFIG_LITTLEFS_PARTITION_LABEL=\"spiffs\"
    -DLED_BUILTIN=10
    -DTOUCH_CS=-1
    -DUSE_SPI_SD
    -DSS=-1
lib_ignore = 
