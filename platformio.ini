[platformio]
platform = espressif32 @ ^6.7.0
lib_deps = 
    SD@^2.0.0
    mquickjs
    bblanchon/ArduinoJson@^6.21.3
[env]
platform = espressif32 @ ^6.7.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
lib_deps = 
    SD@^2.0.0
    ${platformio.lib_deps}
[env:lilygo-t-embed-cc1101]
board = esp32-s3-devkitc-1
build_flags = 
    -DARDUINO_LILYGO_T_EMBED_CC1101
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_LITTLEFS_FOR_IDF_3_2
    -DUSE_SPI_SD
    -DSD_SS_PIN=5
    -DTOUCH_CS=-1
lib_ignore = 
    SD(esp32)
    SD(esp8266)
    SDFS
    SdFat
    SD_MMC
    Ethernet
    WiFi
platform_packages = 
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.14/esp32-2.0.14.zip
    toolchain-xtensa-esp32 @ ~8.4.0+2021r2
    toolchain-xtensa-esp32s3 @ ~8.4.0+2021r2
