[env:lilygo-t-embed-cc1101-lite]
extends = env:lilygo-t-embed-cc1101
build_flags = 
    ${env.build_flags}
    -DLITE_VERSION

[env:lilygo-t-embed-cc1101-debug]
extends = env:lilygo-t-embed-cc1101
build_type = debug
build_flags = 
    ${env.build_flags}
    -DDEBUG
    -DDEBUG_ESP_PORT=Serial
    -DCORE_DEBUG_LEVEL=1

[env:lilygo-t-embed-cc1101-release]
extends = env:lilygo-t-embed-cc1101
build_type = release
build_flags = 
    ${env.build_flags}
    -DRELEASE
    -Os
