[platformio]
default_envs = lilygo-t-embed-cc1101

[env:lilygo-t-embed-cc1101]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

# РАБОЧИЕ библиотеки (проверенные)
lib_deps = 
    bblanchon/ArduinoJson@6.21.3
    spacehuhn/SimpleCLI@^1.1.4
    fbiego/ESP32Time@^2.0.0
    arduino-libraries/NTPClient@^3.2.1
    me-no-dev/AsyncTCP@^1.1.1
    me-no-dev/ESPAsyncWebServer@^1.2.3
    # ESPmDNS из другого источника
    https://github.com/espressif/arduino-esp32.git#2.0.14
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
    # Для CC1101 - альтернативные варианты
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib
    # Или закомментируем если проблемы
    # rocketscream/RadioHead@^1.120.0

build_flags = 
    -Wno-error=deprecated-declarations
    -DDISABLE_SD_CARD=1
    -DUSE_RADIO=1
    -DNO_MDNS_ERRORS
    -Ilib

monitor_filters = direct
board_build.partitions = custom_16Mb.csv

# ST7789 Display
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
